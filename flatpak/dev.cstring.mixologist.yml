app-id: dev.cstring.mixologist
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm20
command: dev.cstring.mixologist
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=xdg-run/pipewire-0:ro
  - --talk-name=org.kde.StatusNotifierWatcher
build-options:
  append-path: /usr/lib/sdk/llvm20/bin:/usr/lib/sdk/odin
  prepend-ld-library-path: /usr/lib/sdk/llvm20/lib
modules:
  - name: SDL3
    buildsystem: cmake-ninja
    builddir: true
    sources:
      - type: git
        url: https://github.com/libsdl-org/SDL.git
        commit: '4940345a2e624fe8aca2eda5ceaf3fb0b90392c9'
    cleanup:
      - '/bin/sdl3-config'
      - '/include'
      - '/lib/libSDL3.la'
      - '/lib/libSDL3main.a'
      - '/lib/libSDL3main.la'
      - '/lib/libSDL3_test.a'
      - '/lib/libSDL3_test.la'
      - '/lib/cmake'
      - '/share/aclocal'
      - '/lib/pkgconfig'
  - name: plutosvg
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - '-DPLUTOSVG_BUILD_EXAMPLES=OFF'
    sources:
      - type: git
        url: https://github.com/sammycage/plutosvg.git
        commit: 31f7d2675416cd777c8e86220b035364873b2a8b
    cleanup:
      - '/include/plutosvg'
      - '/include/plutovg'
      - '/lib/cmake/plutosvg'
      - '/lib/cmake/plutovg'
      - '/lib/pkgconfig'
  - name: odin
    buildsystem: simple
    build-commands:
      - mkdir -p /app/sdk/odin
      - cp -r ./* /app/sdk/odin
    cleanup:
      - '*'
    sources:
      - type: archive
        url: https://github.com/odin-lang/Odin/releases/download/dev-2026-08/odin-linux-amd64-dev-2026-08.tar.gz
        sha256: d858c0a182bb28d7b04b04dbb8aed592a9c96c84e4400ee917c74b45848a4d87
        only-arches:
          - x86_64
      - type: archive
        url: https://github.com/odin-lang/Odin/releases/download/dev-2026-04/odin-linux-arm64-dev-2026-04.tar.gz
        sha256: dea1607f593f6ec2cecf084a6ee9ae9571adc5f5ef0624055efbc9cd57b9dd66
        only-arches:
          - aarch64
  - name: mixologist
    buildsystem: simple
    build-options:
      append-path: /app/sdk/odin
    build-commands:
      - make install EXTRA_ODIN_FLAGS='-extra-linker-flags:"-Wl,-rpath,/app/lib -L/app/lib" -no-rpath' PREFIX='/app' APP_ID=$FLATPAK_ID
      - desktop-file-edit --set-key="Exec" --set-value=$FLATPAK_ID --set-icon=$FLATPAK_ID /app/share/applications/$FLATPAK_ID.desktop
      - install -Dm0644 data/dev.cstring.mixologist.metainfo.xml /app/share/metainfo/$FLATPAK_ID.metainfo.xml
    sources:
      - type: dir
        path: ..
